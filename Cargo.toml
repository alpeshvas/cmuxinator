[package]
name = "cmuxinator"
version = "0.1.1"
edition = "2024"
description = "Start cmux projects from tmuxinator-style YAML files"
repository = "https://github.com/alpeshvas/cmuxinator"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shellexpand = "3"
